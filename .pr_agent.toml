[review_agent]
enabled = true                 # unnecessary after release
publish_output = true          # unnecessary after release
enable_issues_agent = true     # unnecessary after release
enable_compliance_agent = true # unnecessary after release
persistent_comment = true

# if "both" mode is too noisy, keep in "summary" mode in this repo
comments_location_policy = "both"

# severity threshold rank for inline comments: 
# 3=action_required, 
# 2=remediation_recommended, 
# 1=informational. 
# Only findings with rank >= threshold will be published inline
inline_comments_severity_threshold = 3

# Extra prompt to be added as instruction for the agent, for outlier scenarios
issues_extra_instructions = ""
compliance_extra_instructions = ""

[github_app]
pr_commands = [ # list of tools to trigger automatically when a new PR is created
    "/agentic_describe",
    "/agentic_review",
]

handle_push_trigger = true # updates feedback comments with every new commit
push_commands = [ # list of tools to trigger upon each new commit; requires line above to be set to true
    "/agentic_review",
]

[pr_compliance]
enable_rules_platform = true # unnecessary after Rules release

